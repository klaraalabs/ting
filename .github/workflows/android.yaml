name: Android SDK
on:
  push:
    paths: ['sdks/android/**', 'tests/contracts/**', '.github/workflows/android.yaml']
  pull_request:
    paths: ['sdks/android/**', 'tests/contracts/**', '.github/workflows/android.yaml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintRelease assembleRelease publishReleasePublicationToMavenLocal --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-sdk-reports
          path: |
            sdks/android/build/reports/
            sdks/android/build/test-results/
