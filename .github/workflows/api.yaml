name: API
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ting
          POSTGRES_PASSWORD: ting-test-only
          POSTGRES_DB: ting_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ting -d ting_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TING_TEST_DATABASE_URL: postgres://ting:ting-test-only@localhost:5432/ting_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/api/go.mod
          cache: true
          cache-dependency-path: src/api/go.sum
      - run: test -z "$(gofmt -l src/api/cmd src/api/internal)"
      - run: go -C src/api mod verify
      - run: go -C src/api vet ./...
      - run: go -C src/api test -race ./...
      - run: go -C src/api build -o ../../bin/ting ./cmd/ting
      - name: Validate Compose configurations
        env:
          POSTGRES_PASSWORD: compose-validation-only
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml config --quiet
      - run: docker build -f deploy/Dockerfile -t ting:test .
      - name: Image and startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 32)"
          docker run -d --name ting-smoke --network host \
            -e DATABASE_URL="$TING_TEST_DATABASE_URL" \
            -e TING_CREDENTIALS_ENCRYPTION_KEY="$key" \
            -e TING_BIND_ADDRESS=127.0.0.1:8080 ting:test
          trap 'docker rm -f ting-smoke' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/readyz
          docker stop --time 20 ting-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' ting-smoke)" = 0
  publish:
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Select image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
